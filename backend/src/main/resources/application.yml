spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME}
      password: ${SPRING_SECURITY_USER_PASSWORD}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/research-repo-db}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.acd.researchrepo: DEBUG
  pattern:
    level: "%5p [Trace: %X{traceId}]"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [traceId=%X{traceId}] --- [%thread] %-36.36logger{36} : %msg%n%ex"

# ================================================================================
# Application configuration
# ================================================================================
app:
  google:
    client-id: ${APP_GOOGLE_CLIENT_ID}
    client-secret: ${APP_GOOGLE_CLIENT_SECRET}
    redirect-uri: postmessage

  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-expiry: ${APP_JWT_ACCESS_TOKEN_EXPIRY:3600}

  token:
    refresh-token-cookie-name: ${APP_REFRESH_TOKEN_COOKIE_NAME:refreshToken}
    refresh-token-max-age: ${APP_REFRESH_TOKEN_MAX_AGE:2592000}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}

  initial-super-admin-email: ${INITIAL_SUPER_ADMIN_EMAIL:}

  # ================================================================================
  # Storage configuration (inside Docker service not host, not configurable via env)
  # ================================================================================
  storage:
    # Storage provider: local or minio
    provider: ${APP_STORAGE_PROVIDER:local}
    # Path to where the binary files will be saved (used when provider=local)
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:./uploads}

  minio:
    # MinIO connection (used when provider=minio)
    endpoint: ${APP_MINIO_ENDPOINT:http://minio:9000}
    access-key: ${APP_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${APP_MINIO_SECRET_KEY:minioadmin}
    bucket: ${APP_MINIO_BUCKET:research-papers}
    secure: ${APP_MINIO_SECURE:false}
